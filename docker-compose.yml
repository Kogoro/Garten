services:
  specs:
    build: .
    image: specs:prototype
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Externally visible URL (OAuth issuer + redirect URLs). Use your https:// URL behind a reverse proxy.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-0}          # 1 when running behind a reverse proxy
      PROJECT_NAME: ${PROJECT_NAME:-specs}
      DEFAULT_TEAM_NAME: ${DEFAULT_TEAM_NAME:-specs}   # the team created on first start
      DEFAULT_TEAM_KEY: ${DEFAULT_TEAM_KEY:-SPEC}      # prefix of its spec ids (SPEC-001 …)
      # Key for encrypting git tokens / SSH keys at rest. Empty = generated once into the data volume.
      SECRET_KEY: ${SECRET_KEY:-}
      GIT_ALLOW_HTTP: ${GIT_ALLOW_HTTP:-0}      # 1 = allow plain http:// git remotes (LAN Gitea etc.)
      ALLOW_TEAM_CREATION: ${ALLOW_TEAM_CREATION:-1}   # 0 = only instance admins may create teams
      MAX_TEAMS_PER_USER: ${MAX_TEAMS_PER_USER:-5}
      INVITE_TTL_DAYS: ${INVITE_TTL_DAYS:-7}
      # E-mail for invitations (optional). Without SMTP_URL admins copy the invitation link instead.
      #   smtp://user:pass@mail.example.com:587   (STARTTLS)    smtps://user:pass@mail.example.com:465   (implicit TLS)
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-Specs <no-reply@localhost>}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-0}   # 1 = refuse to send over an unencrypted connection
      # Agent trigger (webhook per team): one call this long after the last release / answer.
      HOOK_DEBOUNCE_MS: ${HOOK_DEBOUNCE_MS:-5000}
      HOOK_ALLOW_LOCAL: ${HOOK_ALLOW_LOCAL:-0}   # 1 = webhooks may call http:// and private addresses (LAN runner)
      FOUNDATION_DEBOUNCE_MS: ${FOUNDATION_DEBOUNCE_MS:-15000}  # vision/strategy/glossary go live this long after the last edit
      SEED_DEMO: ${SEED_DEMO:-1}              # 1 = fill an empty database with demo specs
      # First admin (created only on an empty database). Empty password = generated and printed in the log.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional single sign-on via OpenID Connect (Keycloak, Authentik, Google, Entra, ...).
      # Redirect URI to register at the provider: ${PUBLIC_URL}/auth/oidc/callback
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-Single sign-on}
      OIDC_AUTO_CREATE: ${OIDC_AUTO_CREATE:-0}      # 1 = create unknown users on first SSO login
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-viewer}
      OIDC_DEFAULT_TEAM: ${OIDC_DEFAULT_TEAM:-}      # team key new SSO users are added to (empty = first team)
    volumes:
      - specs-data:/data           # SQLite (users, teams, sync state) + one Git repo per team at /data/repos/<team id>
    restart: unless-stopped

  # Optional: reach the server from the internet without opening a port (phone on the road, Claude Code in the cloud).
  # Started by scripts/go-public.sh, which also sets PUBLIC_URL – do not start it by hand.
  tunnel:            # quick tunnel: https://<random>.trycloudflare.com, no account; the address changes when it restarts
    image: cloudflare/cloudflared:latest
    profiles: [public]
    command: tunnel --no-autoupdate --url http://specs:3000
    restart: unless-stopped
  tunnel-named:      # your own Cloudflare tunnel with a fixed address: TUNNEL_TOKEN + PUBLIC_URL in .env
    image: cloudflare/cloudflared:latest
    profiles: [public-named]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped

volumes:
  specs-data:
