version: 2
updates:
  # npm: one pull request per directory for all minor and patch bumps; each major update still gets its own.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      server-minor-patch: { patterns: ['*'], update-types: ['minor', 'patch'] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web-minor-patch: { patterns: ['*'], update-types: ['minor', 'patch'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] } # one pull request for all workflow action bumps
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    # Dependabot only reads the tag ("24-alpine" -> "25-alpine"); it knows nothing about Node's release lines. Odd majors are
    # never LTS, and moving to a new LTS is a decision (check the engines, the CI matrix and the Docker image), so majors stay manual.
    # Digest and patch updates of the pinned image keep coming.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
