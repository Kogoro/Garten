name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # the release workflow runs the same checks before it publishes anything
permissions:
  contents: read   # the workflow only reads the repository

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      # The browser download (~150 MB) is cached per Playwright version; the system libraries it needs come from apt every time.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm test
      - run: npm run ux-audit
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y shellcheck
      - run: bash -n scripts/install-debian.sh && bash -n scripts/release-tarball.sh
      - run: shellcheck -S error scripts/install-debian.sh scripts/release-tarball.sh
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # Layers are cached in the GitHub Actions cache: an unchanged package-lock.json skips both npm ci steps.
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: garten:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix web audit --omit=dev --audit-level=high
