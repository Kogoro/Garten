<title>Garten Klickprototyp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: App-Shell. Desktop = feste Sidebar + Inhalt (max. 1040), Mobil = Top-Bar + Tab-Bar + FAB.
   Spacing strikt 4/8/12/16/24/32/48. Marke Moosgrün: nur Primär-Button, Fokus-Ring, Links, aktive Navigation/Tabs. */
:root {
  --accent-primary: #2b7a57; --accent-hover: #236649; --accent-fg: #ffffff;
  --bg-canvas: #f9faf9; --bg-surface: #ffffff; --bg-subtle: #f1f4f2;
  --text-primary: #111815; --text-secondary: #59635e; --text-tertiary: #8a948f;
  --border: rgba(0, 0, 0, 0.08);
  --warn: #9a6700; --bad: #b42318; --scrim: rgba(17, 24, 21, 0.4);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px; --space-12: 48px;
  --radius-lg: 12px; --radius-md: 8px;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.03);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent-primary: #4db38a; --accent-hover: #6cc4a1; --accent-fg: #07140d;
    --bg-canvas: #0b0d0c; --bg-surface: #141614; --bg-subtle: #1d211f;
    --text-primary: #f2f5f3; --text-secondary: #9ca8a2; --text-tertiary: #6b7670;
    --border: rgba(255, 255, 255, 0.08); --warn: #e0b04a; --bad: #f28b82; --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent-primary: #4db38a; --accent-hover: #6cc4a1; --accent-fg: #07140d;
  --bg-canvas: #0b0d0c; --bg-surface: #141614; --bg-subtle: #1d211f;
  --text-primary: #f2f5f3; --text-secondary: #9ca8a2; --text-tertiary: #6b7670;
  --border: rgba(255, 255, 255, 0.08); --warn: #e0b04a; --bad: #f28b82; --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg-canvas); color: var(--text-primary); font: 400 14px/1.5 var(--font-sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg-surface); z-index: 30; }
h1, h2, h3, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
a { color: var(--accent-primary); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 2px; }
input[type=checkbox], input[type=radio] { accent-color: var(--text-primary); width: 16px; height: 16px; margin: 0; flex: none; }

.h1 { font-size: 24px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; text-wrap: balance; }
.h2 { font-size: 16px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
.h3 { font-size: 14px; font-weight: 600; line-height: 1.4; letter-spacing: -0.01em; }
.meta { font-size: 13px; line-height: 1.4; color: var(--text-secondary); }
.caption { font-size: 12px; font-weight: 500; line-height: 1.3; letter-spacing: 0.01em; color: var(--text-tertiary); }
.mono { font-family: var(--font-mono); font-size: 13px; }
.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.icon-lg { width: 20px; height: 20px; }
.grow { flex: 1; min-width: 0; }
.wrap-any { overflow-wrap: anywhere; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: 40px; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-weight: 500; line-height: 1.5; white-space: nowrap; transition: background-color 120ms var(--ease-out), transform 120ms var(--ease-out); }
.btn-ghost { color: var(--text-secondary); }
.btn-ghost:hover { background: var(--bg-subtle); color: var(--text-primary); }
.btn-line { border: 1px solid var(--border); color: var(--text-primary); background: var(--bg-surface); }
.btn-line:hover { background: var(--bg-subtle); }
.btn-primary { background: var(--accent-primary); color: var(--accent-fg); padding: var(--space-3) var(--space-4); font-weight: 600; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { transform: scale(0.98); }
.btn[disabled] { opacity: 0.4; pointer-events: none; }
.btn-danger { color: var(--bad); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; min-height: 40px; border-radius: var(--radius-md); color: var(--text-secondary); }
.icon-btn:hover { background: var(--bg-subtle); color: var(--text-primary); }
.link { color: var(--accent-primary); font-weight: 500; }

/* Shell */
.shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100dvh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100dvh; display: flex; flex-direction: column; gap: var(--space-6); padding-block: var(--space-4); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: var(--space-4); background: var(--bg-surface); border-right: 1px solid var(--border); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1); }
.brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--radius-md); background: var(--accent-primary); color: var(--accent-fg); }
.brand-name { font-weight: 600; letter-spacing: -0.01em; }
.nav { display: flex; flex-direction: column; gap: var(--space-1); }
.nav-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); color: var(--text-secondary); font-weight: 500; min-height: 40px; }
.nav-item:hover { background: var(--bg-subtle); color: var(--text-primary); text-decoration: none; }
.nav-item[aria-current="page"] { background: var(--bg-subtle); color: var(--accent-primary); }
.nav-item .count { margin-left: auto; font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--space-2); }
.sync { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-3); color: var(--text-tertiary); font-size: 12px; font-weight: 500; }

.content { min-width: 0; padding-block: var(--space-8) var(--space-12); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1040px; margin-inline: auto; display: flex; flex-direction: column; gap: var(--space-8); }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }
.page-head .titles { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; flex: 1; }
.crumb { display: inline-flex; align-items: center; gap: var(--space-1); color: var(--text-secondary); font-size: 13px; }
.actions { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }

.topbar, .tabbar, .fab { display: none; }

/* Sektionen, Karten, Listen */
.section { display: flex; flex-direction: column; gap: var(--space-4); }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
.card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.list { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); overflow: hidden; }
.row { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border); min-width: 0; }
.row:first-child { border-top: 0; }
button.row, a.row { width: 100%; color: inherit; }
button.row:hover, a.row:hover { background: var(--bg-subtle); text-decoration: none; }
.row .stack { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; flex: 1; }
.row .end { display: flex; align-items: center; gap: var(--space-2); flex: none; }
.row-lead { color: var(--text-tertiary); }
.st { display: inline-flex; align-items: center; gap: var(--space-2); font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
.st i { width: 8px; height: 8px; border-radius: 50%; background: var(--text-tertiary); flex: none; }
.st.warn i { background: var(--warn); } .st.bad i { background: var(--bad); }
.st.bad { color: var(--bad); font-weight: 500; } .st.warn { color: var(--warn); font-weight: 500; }
.st .icon { color: var(--text-tertiary); }
.hint-empty { padding: var(--space-8) var(--space-4); text-align: center; display: flex; flex-direction: column; gap: var(--space-2); align-items: center; }

/* Tabs, Segmente */
.tabs { display: flex; gap: var(--space-6); border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab { padding: var(--space-3) 0; margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--text-secondary); font-weight: 500; white-space: nowrap; }
.tab:hover { color: var(--text-primary); }
.tab[aria-selected="true"] { color: var(--accent-primary); border-bottom-color: var(--accent-primary); }
.seg { display: inline-flex; padding: var(--space-1); background: var(--bg-subtle); border-radius: var(--radius-lg); gap: var(--space-1); }
.seg button { padding: var(--space-1) var(--space-3); border-radius: var(--radius-md); color: var(--text-secondary); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--bg-surface); color: var(--text-primary); box-shadow: var(--shadow-card); }

/* Formulare */
.form { display: flex; flex-direction: column; gap: var(--space-6); }
.field { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.field label, .field .lbl { font-weight: 500; }
.input, .select, .textarea { width: 100%; min-height: 40px; padding: var(--space-2) var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg-surface); color: var(--text-primary); font: inherit; }
.input::placeholder, .textarea::placeholder { color: var(--text-tertiary); }
.textarea { resize: vertical; line-height: 1.5; max-width: 68ch; }
.input:focus-visible, .select:focus-visible, .textarea:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 2px; }
.input[readonly] { background: var(--bg-subtle); color: var(--text-secondary); }
.md { font: 400 13px/1.5 var(--font-mono); min-height: 384px; max-width: none; }
.switch { display: flex; align-items: center; gap: var(--space-3); }
.checkrow { display: flex; align-items: flex-start; gap: var(--space-3); }
.checkrow input { margin-top: var(--space-1); }
.item-line { display: flex; align-items: center; gap: var(--space-3); }
.item-line .id { width: 32px; flex: none; color: var(--text-tertiary); }
.code { margin: 0; padding: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg-subtle); font: 400 13px/1.5 var(--font-mono); overflow-x: auto; white-space: pre; }
.prose { max-width: 62ch; display: flex; flex-direction: column; gap: var(--space-3); }
.prose ul { display: flex; flex-direction: column; gap: var(--space-2); list-style: disc; padding-left: var(--space-6); }
.block { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); }
.block:hover { background: var(--bg-subtle); }
.block .caption { width: 64px; flex: none; padding-top: var(--space-1); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.tblwrap { overflow-x: auto; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
table { border-collapse: collapse; width: 100%; min-width: 560px; }
th, td { text-align: left; padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border); vertical-align: middle; }
th { border-top: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.01em; color: var(--text-tertiary); }

/* Menüs / Popover */
.menu-wrap { position: relative; }
.popover { position: absolute; top: 100%; right: 0; margin-top: var(--space-2); z-index: 20; min-width: 256px; padding: var(--space-1); background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card), 0 8px 24px rgba(0, 0, 0, 0.08); transform-origin: top right; opacity: 0; transform: scale(0.96); visibility: hidden; pointer-events: none; transition: opacity 130ms var(--ease-out), transform 130ms var(--ease-out), visibility 0s 130ms; }
.popover.left { right: auto; left: 0; transform-origin: top left; }
.popover.open { opacity: 1; transform: scale(1); visibility: visible; pointer-events: auto; transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out), visibility 0s; }
.menu-item { display: flex; align-items: center; gap: var(--space-3); width: 100%; padding: var(--space-3); border-radius: var(--radius-md); }
.menu-item:hover { background: var(--bg-subtle); }
.menu-item .stack { display: flex; flex-direction: column; gap: var(--space-1); flex: 1; min-width: 0; }

/* Dialoge, Sheets, Toasts */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: grid; place-items: center; padding: var(--space-4); opacity: 0; transition: opacity 130ms var(--ease-out); }
.scrim.in { opacity: 1; transition-duration: 200ms; }
.dialog { width: 100%; max-width: 480px; max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card), 0 16px 48px rgba(0, 0, 0, 0.16); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-6); transform: scale(0.96); opacity: 0; transition: transform 130ms var(--ease-out), opacity 130ms var(--ease-out); }
.scrim.in .dialog { transform: none; opacity: 1; transition-duration: 200ms; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); flex-wrap: wrap; }
.toasts { position: fixed; z-index: 50; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(var(--space-4) + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: var(--space-2); align-items: flex-start; pointer-events: none; max-width: calc(100% - 32px); }
.toast { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--text-primary); color: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card), 0 8px 24px rgba(0, 0, 0, 0.12); transform: translateY(16px); opacity: 0; transition: transform 200ms var(--ease-out), opacity 200ms var(--ease-out); }
.toast.in { transform: none; opacity: 1; }
.toast.out { transform: translateY(16px); opacity: 0; transition-duration: 130ms; }

/* Login */
.login { min-height: 100dvh; display: grid; place-items: center; padding-block: var(--space-6); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: var(--space-8); }
.login-card .card { gap: var(--space-6); }

/* Mobil */
@media (max-width: 959px) {
  .shell { display: block; }
  .side, .only-desktop { display: none !important; }
  .topbar { display: flex; align-items: center; gap: var(--space-3); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; padding: var(--space-2) var(--space-4); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg-surface); border-bottom: 1px solid var(--border); }
  .topbar .brand-mark { width: 32px; height: 32px; }
  .tabbar { display: flex; position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; background: var(--bg-surface); border-top: 1px solid var(--border); padding: var(--space-1) max(8px, env(safe-area-inset-right, 0px)) calc(var(--space-1) + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tabbar a, .tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--space-1); padding: var(--space-2) 0; border-radius: var(--radius-md); color: var(--text-secondary); font-size: 12px; font-weight: 500; text-align: center; }
  .tabbar a:hover { text-decoration: none; }
  .tabbar [aria-current="page"] { color: var(--accent-primary); }
  .fab { display: grid; place-items: center; position: fixed; z-index: 24; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); width: 48px; height: 48px; border-radius: var(--radius-lg); background: var(--accent-primary); color: var(--accent-fg); box-shadow: var(--shadow-card), 0 8px 24px rgba(0, 0, 0, 0.16); }
  .content { padding-block: var(--space-6) calc(var(--space-12) * 2); }
  .toasts { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  .scrim { place-items: end center; padding: 0; }
  .dialog { max-width: none; border-radius: var(--radius-lg) var(--radius-lg) 0 0; transform: translateY(32px); max-height: 90dvh; padding-bottom: calc(var(--space-6) + env(safe-area-inset-bottom, 0px)); }
  .two { grid-template-columns: 1fr; }
  .card { padding: var(--space-4); }
  .page-head .titles { flex: 1 1 100%; }
}
@media (min-width: 960px) { .only-mobile { display: none !important; } }
@media (prefers-reduced-motion: reduce) {
  .popover, .popover.open, .toast, .toast.out, .scrim, .dialog, .btn { transition-duration: 0.01ms !important; }
}
</style>

        '<div class="field"><label for="p-pw">Neues Passwort</label><input class="input" id="p-pw" type="password" placeholder="Mindestens 10 Zeichen" autocomplete="new-password"></div><div class="field"><label for="p-theme">Darstellung</label><select class="select" id="p-theme"><option>System</option><option>Hell</option><option>Dunkel</option></select></div><div><button class="btn btn-primary" type="submit">Save</button></div></form></div>';
    } else {
      body += '<div class="section"><div class="section-head"><h2 class="h2">Persönliche Tokens</h2><button class="btn btn-primary only-desktop" data-act="newtoken">' + ic('plus') + 'New token</button></div><div class="list">' +
        D.tokens.map(function (t, i) { return '<div class="row" style="flex-wrap:wrap"><span class="row-lead">' + ic('key') + '</span><span class="stack"><span class="h3">' + esc(t.n) + '</span><span class="meta">' + t.s + ' · läuft ab ' + t.exp + ' · zuletzt genutzt ' + t.used + '</span></span><button class="btn btn-ghost btn-danger" data-act="deltoken" data-i="' + i + '">Revoke</button></div>'; }).join('') + '</div></div>' +
        '<div class="card"><h3 class="h3">Oder per OAuth anmelden</h3><p class="meta">Empfohlen für lokale Agenten. Du wählst Team und Rechte bei der Anmeldung.</p><pre class="code">claude mcp add --transport http specs https://specs.plattform.example.de/mcp</pre><div><button class="btn btn-line" data-act="copy" data-m="Befehl kopiert.">' + ic('copy') + 'Copy command</button></div></div>';
    }
    return body;
  };

  V.admin = function () {
    var body = head('Admin', { meta: 'Instanz-Verwaltung · Teams und Konten' }) + tabsHtml('adminTab', [['teams', 'Teams'], ['accounts', 'Accounts'], ['email', 'Email'], ['audit', 'Audit log']]);
    var tbl = function (h, rows) { return '<div class="tblwrap"><table><thead><tr>' + h.map(function (x) { return '<th>' + x + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.map(function (r) { return '<tr>' + r.map(function (x) { return '<td>' + x + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>'; };
    if (S.adminTab === 'teams') body += tbl(['Team', 'Mitglieder', 'Specs', 'Letzte Aktivität'], [['<span class="h3">Plattform-Team</span>', '4', '6', 'heute, 22:41'], ['<span class="h3">Eigene Notizen</span>', '1', '0', '3. Nov. 2026']]);
    if (S.adminTab === 'accounts') body += tbl(['Name', 'E-Mail', 'Letzte Anmeldung'], [['Henrik Vogel (Instanz-Admin)', 'henrik.vogel@plattform.example.de', 'heute, 07:55'], ['Lena Hartmann', 'lena.hartmann@plattform.example.de', 'heute, 22:30'], ['Anna Brandt', 'anna.brandt@plattform.example.de', 'heute, 08:41'], ['Jonas Weber', 'jonas.weber@plattform.example.de', 'gestern, 16:10'], ['Mira Çelik', 'mira.celik@plattform.example.de', '10. Nov. 2026']]);
    if (S.adminTab === 'email') body += '<div class="card"><p class="meta" style="max-width:62ch">E-Mail wird nur für Einladungen und den Feedback-Digest genutzt.</p><div class="list" style="box-shadow:none"><div class="row"><span class="grow">SMTP</span><span class="mono">mail.plattform.example.de:587 · STARTTLS</span></div><div class="row"><span class="grow">Absender</span><span class="mono">specs@plattform.example.de</span></div></div><div><button class="btn btn-line" data-act="toast" data-m="Testmail an lena.hartmann@plattform.example.de gesendet.">' + ic('mail') + 'Send test mail</button></div></div>';
    if (S.adminTab === 'audit') body += tbl(['Zeitpunkt', 'Wer', 'Ereignis'], D.audit);
    return body;
  };

  /* ---------- Dialoge ---------- */
  var layer = $('#layer'), lastTrigger = null;
  function dialog(title, bodyHtml, actionsHtml, opt) {
    closeDialog(true);
    var scr = document.createElement('div');
    scr.className = 'scrim';
    scr.innerHTML = '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><h2 class="h1" id="dlg-t" style="font-size:18px">' + title + '</h2>' + bodyHtml + '<div class="dialog-actions">' + actionsHtml + '</div></div>';
    layer.appendChild(scr);
    var dlg = $('.dialog', scr);
    if (lastTrigger && window.innerWidth >= 960) { /* Ursprung: Auslöser */
      var t = lastTrigger.getBoundingClientRect(), d = dlg.getBoundingClientRect();
      dlg.style.transformOrigin = Math.max(0, t.left + t.width / 2 - d.left) + 'px ' + Math.max(0, t.top + t.height / 2 - d.top) + 'px';
    } else if (window.innerWidth < 960) { dlg.style.transformOrigin = 'bottom center'; }
    requestAnimationFrame(function () { requestAnimationFrame(function () { scr.classList.add('in'); var f = $('input,select,textarea,button.btn-primary', dlg); if (f) f.focus(); }); });
    scr.addEventListener('mousedown', function (e) { if (e.target === scr) closeDialog(); });
    return dlg;
  }
  function closeDialog(now) {
    var scr = $('.scrim', layer); if (!scr) return;
    if (now) { scr.remove(); return; }
    scr.classList.remove('in'); setTimeout(function () { scr.remove(); }, 150);
    if (lastTrigger && document.body.contains(lastTrigger)) lastTrigger.focus();
  }
  var X = '<button class="btn btn-ghost" data-act="close">Cancel</button>';
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.innerHTML = ic('check') + '<span>' + esc(msg) + '</span>';
    $('#toasts').appendChild(t);
    requestAnimationFrame(function () { requestAnimationFrame(function () { t.classList.add('in'); }); });
    setTimeout(function () { t.classList.remove('in'); t.classList.add('out'); setTimeout(function () { t.remove(); }, 150); }, 4200);
  }

  /* ---------- Rendering ---------- */
  function render() {
    var r = S.auth ? S.route : 'login';
    var v = V[r] ? V[r]() : V.garden();
    if (r === 'login') { $('#app').innerHTML = v; return; }
    var fab = { specs: ['newspec', 'New spec'], docs: ['newdoc', 'New document'], glossary: ['newterm', 'New term'] }[r];
    if (r === 'team' && S.teamTab === 'members') fab = ['invite', 'Invite people'];
    if (r === 'account' && S.accTab === 'agent') fab = ['newtoken', 'New token'];
    $('#app').innerHTML = shell({ body: v, fab: fab });
    window.scrollTo(0, 0);
  }
  function go(r) { S.route = r; if (r !== 'docs') { S.docId = null; S.docEdit = false; } if (location.hash !== '#' + r) location.hash = r; render(); }
  window.addEventListener('hashchange', function () { var r = location.hash.slice(1); if (V[r] && r !== S.route) { S.route = r; if (r !== 'docs') { S.docId = null; S.docEdit = false; } render(); } });

  /* ---------- Aktionen ---------- */
  var ACT = {
    close: function () { closeDialog(); },
    toast: function (el) { toast(el.dataset.m); },
    copy: function (el) { toast(el.dataset.m); },
    sso: function () { S.auth = true; go('garden'); },
    logout: function () { S.auth = false; S.route = 'login'; location.hash = 'login'; render(); },
    tab: function (el) { S[el.dataset.k] = el.dataset.v; render(); },
    mode: function (el) { S.mode = el.dataset.v; render(); },
    more: function (el) {
      lastTrigger = el;
      dialog('Mehr', '<nav class="nav">' + NAV2.map(function (n) { return '<a class="nav-item" href="#' + n[0] + '" data-act="close">' + ic(n[2], 'icon-lg') + n[1] + '</a>'; }).join('') + '<button class="nav-item" data-act="logout">' + ic('log-out', 'icon-lg') + 'Sign out</button></nav>', X);
    },
    openspec: function (el, e) { e.preventDefault(); S.specId = el.dataset.id; S.specTab = el.dataset.tab || 'content'; S.mode = 'form'; go('spec'); },
    newspec: function (el) {
      lastTrigger = el;
      dialog('New spec', '<div class="form"><div class="field"><label for="ns-type">Typ</label><select class="select" id="ns-type">' + D.types.map(function (t) { return '<option>' + t[0] + '</option>'; }).join('') + '</select><span class="meta">Jeder Typ bringt eine Vorlage mit.</span></div><div class="field"><label for="ns-title">Titel</label><input class="input" id="ns-title" placeholder="z. B. Abrechnung: Teilzahlungen"></div></div>', X + '<button class="btn btn-primary" data-act="createspec">Create draft</button>');
    },
    createspec: function () {
      var title = $('#ns-title').value.trim(), type = $('#ns-type').value;
      if (!title) { $('#ns-title').focus(); toast('Bitte einen Titel eingeben.'); return; }
      var id = (type.replace(/[^A-Za-z]/g, '').slice(0, 2).toUpperCase() || 'SP') + '-' + String(10 + D.specs.length).padStart(3, '0');
      D.specs.unshift({ id: id, title: title, type: type, state: 'draft', ver: 'v0.1', by: 'Lena Hartmann', at: 'gerade eben' });
      D.content[id] = JSON.parse(JSON.stringify(SPEC_TEMPLATE));
      closeDialog(true); S.specId = id; S.specTab = 'content'; S.mode = 'form'; go('spec'); toast('Draft ' + id + ' angelegt. Nur für dich sichtbar.');
    },
    add: function (el) { var c = D.content[S.specId]; if (el.dataset.what === 'reqs') c.reqs.push(''); else c.ac.push(['', false]); render(); var ins = $$('[data-bind="' + (el.dataset.what === 'reqs' ? 'reqs' : 'ac') + '"]'); if (ins.length) ins[ins.length - 1].focus(); },
    'approve-open': function (el) {
      lastTrigger = el; var s = spec(), n = openFb(s.id).length;
      dialog('Approve ' + s.ver, '<div class="form" style="gap:16px"><p>Die Freigabe schreibt <span class="mono">specs/' + s.id + '.md</span> ins Team-Repository (Commit und Tag ' + s.ver + ', Autor: Lena Hartmann) und macht die Version für Agenten sichtbar.</p><p class="meta">Änderungen seit ' + (s.rel || 'dem Entwurf') + ': 2 Requirements geändert, 1 Kriterium neu.</p>' + (n ? '<p class="st warn" style="white-space:normal"><i></i>' + n + ' offene Feedback-Einträge von Agenten. <a data-act="gofb">Feedback ansehen</a></p>' : '') + '<label class="switch"><input type="checkbox" id="ap-push" checked><span>Danach nach origin/main pushen</span></label></div>', X + '<button class="btn btn-primary" data-act="approve">Approve ' + s.ver + '</button>');
    },
    gofb: function () { closeDialog(true); S.specTab = 'feedback'; render(); },
    approve: function () {
      var s = spec(), push = $('#ap-push') && $('#ap-push').checked; s.state = 'approved'; s.impl = 'new'; s.by = 'Lena Hartmann'; s.at = 'gerade eben';
      closeDialog(true); render(); toast('Approved ' + s.ver + ' · Release nach specs/' + s.id + '.md' + (push ? ' · gepusht nach origin/main' : '')); setTimeout(function () { toast('Agent trigger ausgelöst: HTTP 202.'); }, 500);
    },
    withdraw: function () { var s = spec(); s.state = 'draft'; s.at = 'gerade eben'; render(); toast(s.ver + ' zurückgezogen. Die Spec ist wieder ein Entwurf.'); },
    answer: function (el) {
      var d = D.decisions.filter(function (x) { return x.id === el.dataset.id; })[0], sel = $('input[name="' + d.id + '"]:checked');
      if (!sel) { toast('Bitte eine Antwort wählen.'); return; }
      d.answer = sel.value; render(); toast('Antwort gesendet: ' + sel.value + '. Der Agent trigger läuft erneut.');
    },
    fb: function (el) {
      var f = D.feedback.filter(function (x) { return x.id === el.dataset.id; })[0];
      if (el.dataset.do === 'accept') { f.state = 'accepted'; D.content[f.spec].notes.push(f.text); toast('Übernommen als Punkt unter REVIEW NOTES in ' + f.spec + '.'); }
      else { f.state = 'declined'; toast('Feedback abgelehnt. Der Agent wird informiert.'); }
      render();
    },
    opendoc: function (el) { S.docId = el.dataset.id; S.docEdit = false; render(); },
    newdoc: function (el) {
      lastTrigger = el;
      dialog('New document', '<div class="field"><label for="nd-path">Pfad</label><input class="input mono" id="nd-path" placeholder="betrieb/runbook-backup.md"><span class="meta">Ordner bis 5 Ebenen. Das Dokument landet unter specs/docs/.</span></div>', X + '<button class="btn btn-primary" data-act="createdoc">Create document</button>');
    },
    createdoc: function () {
      var p = $('#nd-path').value.trim(); if (!p) { $('#nd-path').focus(); return; }
      if (!/\.md$/.test(p)) p += '.md';
      var id = 'n' + D.docs.length; D.docs.push({ id: id, path: p, name: p.split('/').pop().replace(/\.md$/, ''), at: 'gerade eben', body: '' });
      closeDialog(true); S.docId = id; S.docEdit = true; render(); toast('Dokument angelegt.');
    },
    docedit: function () { S.docEdit = !S.docEdit; render(); if (!S.docEdit) toast('Gespeichert. Release automatisch in 5 Sekunden.'); },
    term: function (el) {
      lastTrigger = el; var t = D.terms.filter(function (x) { return x.t === el.dataset.t; })[0];
      dialog(esc(t.t), '<div class="form" style="gap:12px"><p>' + esc(t.def) + '</p>' + (t.alias ? '<p class="meta">Alias: ' + esc(t.alias) + '</p>' : '') + (t.see ? '<p class="meta">Siehe auch: <a data-act="term" data-t="' + esc(t.see) + '">' + esc(t.see) + '</a></p>' : '') + '</div>', '<button class="btn btn-ghost" data-act="close">Close</button>');
    },
    newterm: function (el) {
      lastTrigger = el;
      dialog('New term', '<div class="form"><div class="field"><label for="nt-t">Begriff</label><input class="input" id="nt-t" placeholder="z. B. Gutschrift"></div><div class="field"><label for="nt-d">Definition</label><textarea class="textarea" id="nt-d" rows="3"></textarea></div><button class="btn btn-ghost" style="align-self:flex-start" data-act="toast" data-m="Suche nach Definitionen online: nur der Suchbegriff wird gesendet.">' + ic('search') + 'Search definitions online</button></div>', X + '<button class="btn btn-primary" data-act="createterm">Add term</button>');
    },
    createterm: function () {
      var t = $('#nt-t').value.trim(); if (!t) { $('#nt-t').focus(); return; }
      D.terms.unshift({ t: t, def: $('#nt-d').value.trim() || 'Noch keine Definition.', alias: '', see: '' }); closeDialog(true); render(); toast('Begriff „' + t + '“ angelegt.');
    },
    newteam: function (el) { lastTrigger = el; dialog('Neues Team', '<div class="field"><label for="tm-n">Name</label><input class="input" id="tm-n" placeholder="z. B. Vertrieb"></div>', X + '<button class="btn btn-primary" data-act="close">Create team</button>'); },
    invite: function (el) {
      lastTrigger = el;
      dialog('Invite people', '<div class="form"><div class="field"><label for="iv-m">E-Mail</label><input class="input" id="iv-m" type="email" placeholder="name@firma.de"></div><div class="field"><label for="iv-r">Rolle</label><select class="select" id="iv-r"><option>editor</option><option>viewer</option><option>approver</option><option>admin</option></select></div><p class="meta">Der Link ist 7 Tage gültig und wird per Mail verschickt.</p></div>', X + '<button class="btn btn-primary" data-act="sendinvite">Send invitation</button>');
    },
    sendinvite: function () {
      var m = $('#iv-m').value.trim(); if (!/.+@.+\..+/.test(m)) { $('#iv-m').focus(); toast('Bitte eine gültige E-Mail eingeben.'); return; }
      D.invites.push({ e: m, r: $('#iv-r').value, exp: 'läuft in 7 Tagen ab' }); closeDialog(true); render(); toast('Einladung an ' + m + ' gesendet.');
    },
    resend: function (el) { D.invites[+el.dataset.i].exp = 'läuft in 7 Tagen ab'; render(); toast('Einladung erneut gesendet. Der alte Link ist ungültig.'); },
    revoke: function (el) { D.invites.splice(+el.dataset.i, 1); render(); toast('Einladung widerrufen.'); },
    role: function () {},
    newtoken: function (el) {
      lastTrigger = el;
      dialog('New token', '<div class="form"><div class="field"><label for="tk-n">Name</label><input class="input" id="tk-n" placeholder="z. B. Nightly-Agent"></div><div class="field"><label for="tk-s">Scope</label><select class="select" id="tk-s"><option>Read</option><option selected>Read &amp; write drafts</option><option>Read &amp; write</option></select></div><div class="field"><label for="tk-e">Ablauf</label><select class="select" id="tk-e"><option>30 Tage</option><option selected>90 Tage</option><option>1 Jahr</option><option>Nie</option></select></div></div>', X + '<button class="btn btn-primary" data-act="createtoken">Create token</button>');
    },
    createtoken: function () {
      var n = $('#tk-n').value.trim(); if (!n) { $('#tk-n').focus(); return; }
      var tok = 'spc_' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 14), s = $('#tk-s').value, e = $('#tk-e').value;
      D.tokens.unshift({ n: n, s: s, exp: e === 'Nie' ? 'nie' : '10. Feb. 2027', used: 'noch nie' });
      var d = dialog('Token erstellt', '<div class="form"><p class="meta">Kopiere das Token jetzt. Danach wird es nie wieder angezeigt.</p><pre class="code wrap-any" style="white-space:pre-wrap">' + tok + '</pre></div>', '<button class="btn btn-ghost" data-act="copy" data-m="Token kopiert.">' + ic('copy') + 'Copy</button><button class="btn btn-primary" data-act="done-token">Done</button>');
    },
    'done-token': function () { closeDialog(true); render(); },
    deltoken: function (el) { D.tokens.splice(+el.dataset.i, 1); render(); toast('Token widerrufen.'); }
  };

  document.addEventListener('click', function (e) {
    var m = e.target.closest('[data-menu]');
    if (m) {
      e.stopPropagation(); var pop = $('#m-' + m.dataset.menu), open = pop.classList.contains('open');
      $$('.popover.open').forEach(function (p) { p.classList.remove('open'); }); if (!open) pop.classList.add('open'); return;
    }
    var a = e.target.closest('[data-act]');
    if (!a) { $$('.popover.open').forEach(function (p) { p.classList.remove('open'); }); return; }
    $$('.popover.open').forEach(function (p) { p.classList.remove('open'); });
    var fn = ACT[a.dataset.act]; if (fn) { if (!['createspec', 'approve', 'createdoc', 'createterm', 'sendinvite', 'createtoken', 'done-token', 'close', 'gofb', 'answer', 'fb'].some(function (k) { return k === a.dataset.act; }) && !$('.scrim', layer)) lastTrigger = a; fn(a, e); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if ($('.scrim', layer)) closeDialog(); $$('.popover.open').forEach(function (p) { p.classList.remove('open'); }); } });
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'login-form') { S.auth = true; go('garden'); toast('Angemeldet als Lena Hartmann.'); }
    else toast('Gespeichert.');
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.filter) { var q = t.value.trim().toLowerCase(), n = 0; $$('#rows [data-s]').forEach(function (r) { var hit = !q || r.dataset.s.indexOf(q) > -1; r.hidden = !hit; if (hit) n++; }); $('#rows-empty').hidden = n > 0; return; }
    var b = t.dataset.bind; if (!b) return; var c = D.content[S.specId], i = +t.dataset.i;
    if (b === 'summary') c.summary = t.value; else if (b === 'reqs') c.reqs[i] = t.value; else if (b === 'ac') c.ac[i][0] = t.value; else if (b === 'ac-done') c.ac[i][1] = t.checked;
    else if (b === 'doc') D.docs.filter(function (x) { return x.id === S.docId; })[0].body = t.value;
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.bind === 'ac-done') { var c = D.content[S.specId]; c.ac[+t.dataset.i][1] = t.checked; }
    if (t.dataset.act === 'role') { D.members[+t.dataset.i].r = t.value; toast('Rolle von ' + D.members[+t.dataset.i].n + ' ist jetzt ' + t.value + '.'); }
  });

  var h = location.hash.slice(1);
  S.route = V[h] && h !== 'login' ? h : 'login';
  render();
})();
</script>
