name: Release
# Push a tag like v0.11.0 to publish a release. `garten update` installs the newest release, so nothing is published unless
# the same checks as CI pass. A release carries:
#   garten-<tag>.tar.gz (+ .sha256)   the prebuilt app (web/dist built, no node_modules) – what install-debian.sh downloads
#   ghcr.io/<owner>/<repo>:<version>   the Docker image for amd64 and arm64; also :latest unless it is a pre-release (tag with "-")
on:
  push:
    tags: ['v*']
permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $v" >&2; exit 1; }

  image:
    needs: [checks, version]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
      - name: Image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"          # registry names must be lowercase
          version="${GITHUB_REF_NAME#v}"
          tags="$image:$version"
          case "$version" in *-*) ;; *) tags="$tags,$image:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [checks, version, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Pack the release archive
        run: scripts/release-tarball.sh "$GITHUB_REF_NAME" dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $flags \
            "dist/garten-$GITHUB_REF_NAME.tar.gz" "dist/garten-$GITHUB_REF_NAME.tar.gz.sha256"
