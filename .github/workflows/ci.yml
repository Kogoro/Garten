name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read   # the workflow only reads the repository

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run ux-audit
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y shellcheck
      - run: bash -n scripts/install-debian.sh ct/garten.sh install/garten-install.sh
      - run: shellcheck -S error scripts/install-debian.sh
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t garten:ci .
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix web audit --omit=dev --audit-level=high
